name: 无邪人生目标树 - 验证与自动部署

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 部署环境
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: wuxie-life-atlas-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs

  preview:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview to the existing Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=wuxie-life-atlas --branch=actions-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.target == 'production') ||
       (github.event_name == 'push' && vars.AUTO_DEPLOY_PRODUCTION == 'true'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to the existing production Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=wuxie-life-atlas --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
